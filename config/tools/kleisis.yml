# Configuration of Kleisis for the schemas that Ekphrasis publishes.
_schema: kleisis:configuration@1

paths:
  owned_schemas: specs/schemas
  registry: specs/schema-registry.yml

exports:
  - ekphrasis:configuration@1

# The keywords to which Ekphrasis gives a meaning in the form of a record; a schema of another tool
# uses them through the registry of Ekphrasis.
keywords:
  x-kind: the field kind, which fixes the control through which the field is filled
  x-list-layout: the initial layout of a field of kind list, compact or expanded
  x-tree-role: the presentation role of a scalar property of an item of kind tree
  x-rules: the rules checked on a field, or on the root, beside the standard keywords
  x-collapsed: whether a group or a collection is folded when the form opens
  x-align: the alignment of a formula in its control or its cell
  x-image-width: the width of each image of a field of kind image
  x-unfilled: the values counted as unfilled beside the null value, at the root
  x-version: the version of a schema, at its root
  x-reference: the entries of other records that a string field names
  x-graph-role: the role of an array of a field of kind graph, which holds its nodes or its edges
