title: "Onset of sustained oscillation in a driven damped pendulum"
statement: "Across driven damped pendulums with a periodic forcing of fixed frequency, which bounds on the ratio of forcing amplitude to damping are necessary, sufficient, or both for a sustained periodic oscillation to replace the decay towards rest? The contrast is with a decay to the rest state and with an aperiodic motion. Which sufficient bounds remain valid as the forcing frequency approaches the natural frequency of the pendulum, and which require the small-angle approximation?" # restate the fields
id: quest.pendulum.sustained-oscillation
type: question
status: posed # posed | refined | answered | abandoned
subject:
  target_system: system.pendulum-driven-damped
  phenomenon: phen.pendulum.sustained-oscillation
  contrast:
    locus: other-outcome # other-outcome | other-system | other-condition | none
    foil_set:
      - name: "decay to rest"
        symbol: decay
        expression: ["A <= 0"]
        reading: "The amplitude of the oscillation decreases to zero, as without forcing."
      - name: "aperiodic motion"
        symbol: aperiodic
        expression: ["A > 0", "lyap > 0"]
        reading: "The motion stays bounded away from rest but never repeats."
    compatibility: derived
    foil_status: open # observed | counterfactual | not-applicable
