# Synthetic schema for exercising schema and form constructs used by a research record.
# constructs: nested groups, choices as `enum` and as `oneOf` of `const` values with titles,
# records with nested flow sequences and flow mappings, a map keyed by dotted field
# paths with values admitted by `additionalProperties`, a nullable field, the unfilled values
# `open`, `[]` and `{}`, the conditional rule of gnomon in which the epistemic aim decides the
# required fields (its entries for the question record, from `by_aim` of `requirements.yml`),
# written with `required-when` at the root, the field of the identifier declared by `x-identifier`

$schema: https://json-schema.org/draft/2020-12/schema
$id: question.schema.yaml
title: Question
type: object
required: [title, statement, id, type, status, subject, task]
x-unfilled: [open, [], {}]
x-identifier: id
x-rules:
  - check: required-when
    field: task.required_accuracy.outputs_to_match
    when: { field: task.epistemic_aim, equals: prediction }
  - check: required-when
    field: subject.contrast.foil_set
    when: { field: task.epistemic_aim, equals: explanation }
  - check: required-when
    field: task.requested_relation
    when: { field: task.epistemic_aim, equals: explanation }
  - check: required-when
    field: task.modal_strength
    when: { field: task.epistemic_aim, equals: modal-knowledge }
  - check: required-when
    field: task.proof_obligations
    when: { field: task.epistemic_aim, equals: modal-knowledge }
properties:
  title:
    type: string
    x-kind: markdown-line
  statement:
    type: string
    x-kind: markdown
  id:
    type: string
    x-kind: label
  type:
    const: question
  status:
    enum: [posed, refined, answered, abandoned]
  subject:
    type: object
    required: [target_system, phenomenon]
    properties:
      target_system:
        type: string
        x-kind: label
      phenomenon:
        type: string
        x-kind: label
      contrast:
        type: object
        properties:
          locus: { enum: [other-outcome, other-system, other-condition, none] }
          foil_set:
            type: array
            items:
              type: object
              properties:
                name: { type: string }
                symbol: { type: string, x-kind: label }
                expression:
                  type: array
                  items: { type: string, x-kind: latex }
                reading:
                  type: string
                  x-kind: markdown-line
          compatibility:
            enum: [derived, exclusive, compatible]
          foil_status: { enum: [observed, counterfactual, not-applicable] }
      domain:
        type: object
        properties:
          restrictions:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                of:
                  type: string
                  x-kind: label
                restriction:
                  type: [string, "null"]
                  enum: [clamped, restricted, initial, stationary, without-event]
                values:
                  type: string
                expression:
                  type: string
                justification:
                  type: string
                  x-kind: markdown-line
          limit:
            type: object
            properties:
              expression:
                type: string
              justification:
                type: string
                x-kind: markdown-line
  task:
    type: object
    required: [epistemic_aim]
    properties:
      epistemic_aim:
        oneOf:
          - { const: description, title: Description }
          - { const: exploration, title: Exploration }
          - { const: prediction, title: Prediction }
          - { const: explanation, title: Explanation }
          - { const: modal-knowledge, title: Modal knowledge }
          - { const: model-knowledge, title: Model knowledge }
      requested_relation:
        enum:
          - causal-intervention
          - causal-mechanistic
          - constitutive
          - functional
          - nomological
          - statistical
          - mathematical
          - not-applicable
      modal_strength: { enum: [actual, possible, necessary] }
      admissible_explanans:
        type: object
        properties:
          compositional:
            type: array
            items:
              type: string
              x-kind: label
          substrate: { enum: [specific, independent, mapping] }
          justification:
            type: string
            x-kind: markdown-line
      required_accuracy:
        type: object
        properties:
          standard:
            enum: [qualitative, order-of-magnitude, numeric-bound, structural-only, not-applicable]
          outputs_to_match:
            type: array
            items:
              type: object
              properties:
                target:
                  type: string
                  x-kind: label
                tolerance:
                  type: object
                  properties:
                    metric:
                      type: string
                      x-kind: latex
                    bound:
                      type: string
                      x-kind: latex
                justification:
                  type: string
                  x-kind: markdown-line
          structures_to_match:
            type: array
            items:
              type: object
              properties:
                target:
                  type: string
                  x-kind: label
                justification:
                  type: string
                  x-kind: markdown-line
      proof_obligations:
        type: array
        items:
          type: object
          properties:
            name: { type: string }
            reading:
              type: string
              x-kind: markdown-line
            antecedent:
              type: array
              items: { type: string, x-kind: latex }
            consequent:
              type: array
              items: { type: string, x-kind: latex }
  virtues:
    type: array
    items:
      type: object
      properties:
        virtue:
          enum:
            - unification
            - generality
            - robustness
            - intelligibility
            - structural-transparency
            - economy
            - tractability
        standing:
          oneOf:
            - { const: constitutive }
            - { const: preferred }
        justification:
          type: string
          x-kind: markdown-line
        check:
          type: object
          properties:
            verdict: { enum: [pending, met, unmet] }
            evidence: { type: string }
            note: { type: string, x-kind: latex }
  maturity:
    type: object
    additionalProperties: { enum: [provisional, stabilized] }
